[tool.poetry]
name = "experimetrics"
version = "0.1.0"
description = "Modern A/B experimentation utilities: CUPED/CUPAC hooks, triggered analysis, SRM, switchback helpers, and power sims."
authors = ["Diogo Ribeiro and contributors"]
license = "MIT"
readme = "README.md"
packages = [
    { include = "experimetrics", from = "src" },
    { include = "examples" },
]
include = ["src/experimetrics/py.typed"]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
numpy = "^2.3.5"
pandas = "^2.2.0"
scipy = "^1.16.3"
typing-extensions = "^4.12.0"

# Optional extras
scikit-learn = { version = "^1.5.0", optional = true }
matplotlib = { version = "^3.9.0", optional = true }

[tool.poetry.extras]
ml = ["scikit-learn"]
viz = ["matplotlib"]

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.2"
pytest-cov = "^7.0.0"
mypy = "^1.19.0"
ruff = "^0.14.10"
pandas-stubs = "^2.2.0"
scipy-stubs = "^1.16.3"
pre-commit = "^4.5.0"
mkdocs = "^1.6.1"
mkdocs-material = "^9.7.0"

[tool.ruff]
line-length = 100
fix = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.pytest.ini_options]
addopts = "-q --cov=experimetrics --cov-report=term-missing"
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
